name: book-releases

on:
  schedule:
    # Daily at 13:00 UTC. Adjust to a quiet hour you like.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the would-be email and do not send or commit state"
        type: boolean
        default: false

permissions:
  contents: write # needed to commit state.json back to the repo

concurrency:
  group: book-releases
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Run tracker
        run: npx tsx src/main.ts run ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          HARDCOVER_TOKEN: ${{ secrets.HARDCOVER_TOKEN }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Commit updated state
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "book-releases-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "state: run $(date -u +%FT%TZ)"
          git push
